# ==============================================================================
# Ansible Inventory - Markdown Tech Blog
# ==============================================================================
# This file defines the target host(s) where Ansible will deploy the
# Markdown Tech Blog application.
#
# For LOCAL / testing use, we use 'localhost' with 'local' connection
# so no SSH is required. This lets you validate the playbook safely
# on your own machine before pointing it at a real remote server.
#
# To target a real remote server, replace '127.0.0.1' with the server's
# IP address or hostname and set ansible_connection=ssh.
# ==============================================================================

[blog_servers]
localhost ansible_connection=local ansible_user=root

# ------------------------------------------------------------------------------
# Example: Real remote server (uncomment and edit to use)
# ------------------------------------------------------------------------------
# [blog_servers]
# 192.168.1.100 ansible_connection=ssh ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_rsa
# ------------------------------------------------------------------------------

[blog_servers:vars]
# Application-level variables shared by all hosts in this group
app_name=markdown-tech-blog
app_port=8080
docker_image=selvanayaki06/markdown-tech-blog
docker_tag=latest
