services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-ci
    restart: always
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root

volumes:
  jenkins_home:
    external: true
